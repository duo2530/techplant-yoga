<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的 · 一水瑜伽普拉提</title>
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 每个页面自带雪碧图工具类：固定 390 宽 = 源图 1170 的 1/3 */
  .sprite { background-repeat: no-repeat; background-size: 390px auto; }
</style>
</head>
<body>
<div class="phone">

  <!-- ============ 固定区 1：状态栏 ============ -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#000"><path d="M8 10.6 5.9 8.3a3.1 3.1 0 0 1 4.2 0L8 10.6Zm0-5.1c-1.5 0-2.9.5-4 1.5L2.6 5.6A7.9 7.9 0 0 1 8 3.4c2 0 3.9.8 5.4 2.2L12 7c-1.1-1-2.5-1.5-4-1.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#000"/><path d="M23 4.2v3.6c1-.3 1.4-.9 1.4-1.8s-.4-1.5-1.4-1.8Z" fill="#000" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- ============ 固定区 2：导航栏（一级页，无返回箭头）
       标题按截图原文为品牌四字「一水瑜伽」；左侧为带斜杠的铃铛图标（消息入口） ============ -->
  <div class="navbar">
    <a href="messages.html" class="press cursor-pointer absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8.6a6 6 0 1 0-12 0c0 5.2-2 6.7-2 6.7h16s-2-1.5-2-6.7Z"/>
        <path d="M10.3 19.2a2 2 0 0 0 3.4 0"/>
        <path d="M3.4 3.4 20.6 20.6"/>
      </svg>
    </a>
    <span class="nav-title">一水瑜伽</span>
    <div class="capsule">
      <span class="cap-btn"><svg width="17" height="5" viewBox="0 0 17 5" fill="#333"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="8.5" cy="2.5" r="1.6"/><circle cx="14.5" cy="2.5" r="1.6"/></svg></span>
      <span class="cap-div"></span>
      <span class="cap-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="1.6" fill="#333" stroke="none"/></svg></span>
    </div>
  </div>

  <!-- ============ 可滚动内容区 ============
       必须显式 flex-direction:column：.phone 的行内 height:844px 会让 flex 主轴解析成水平，
       仅靠 Tailwind 的 h-[..] 类无法稳定撑开子块（会被压扁成内容最小高度），
       故在 .screen 上明确纵向排布 + flex:1 1 auto。 -->
  <div class="screen bg-page" style="display:flex;flex-direction:column;flex:1 1 auto">

    <!-- ===== 用户信息区（淡蓝照片背景 + 头像 + 登录状态） =====
         实测依据（全部来自源图）：
         · 账号行深色文字带 逻辑 y=105..127（"暂未登录"）、139..151（"未绑定手机号"）
         · 四宫格白卡上沿 逻辑 y=188（亮度实测：y<188 平均 241 是页灰底，y≥188 平均 254.9 是卡白）
         · 照片/渐变底最迟到 逻辑 y≈168 淡出为白
         所以：背景层高 80px（视觉 y=88..168），内容不裁剪以免头像/文字被 overflow 切掉，
         账号内容块 top=58 → 昵称中心落在 逻辑 116.5、手机号行 ~145，与源图文字带一致。
         **必须显式给 flex 基准**：.screen 里本块子元素全是 absolute，内容高度算 0，
         只写 Tailwind 高度类会被压成 h=0（实测）。故用行内 flex:0 0 80px;height:80px。
         背景：雪碧图 1/3 规则（390 宽 = 源图 1170），取景窗取源图照片条带，
         原图自带的头像/文字用 blur-[6px] 化开当虚化底；裁剪只作用于背景层。 -->
    <div class="relative flex-none -mt-[44px]" style="height:80px">
      <div class="absolute left-0 right-0 top-0 overflow-hidden" style="height:80px">
        <div class="absolute inset-0 sprite blur-[6px]" style="background-image:url('../需求文档/用户端/用户端小程序截图/我的页面.png');background-size:390px 160px;background-position:0 -44px;background-repeat:no-repeat"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-white/20 via-transparent via-45% to-white"></div>
      </div>

      <!-- 内容：源图头像与昵称同轴，文字中心 逻辑 116 → 块内 top = 116-44-26(头像半径) = 46 -->
      <div class="absolute left-[40px] right-4 top-[58px] flex items-center gap-[13px]">
        <!-- 头像：雪碧图切自原截图（源图 x=114..270, y=279..435 → 逻辑 -38px,-93px 起 52x52），白色圆环外框 -->
        <div class="w-[52px] h-[52px] rounded-full sprite ring-2 ring-white/85" style="background-image:url('../需求文档/用户端/用户端小程序截图/我的页面.png');background-position:-38px -93px;background-repeat:no-repeat"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-[19px] font-semibold text-ink-1">暂未登录</span>
            <!-- 会员等级胶囊：V0 + 普通会员 -->
            <span class="flex items-center h-[19px] rounded-full bg-[#4A4A4A] overflow-hidden">
              <span class="px-[6px] text-[10px] text-white/95">V0</span>
              <span class="px-[7px] text-[10px] text-white bg-[#5C5C5C] leading-[19px]">普通会员</span>
            </span>
          </div>
          <div class="mt-[5px] text-[12px] text-ink-2">未绑定手机号</div>
        </div>
      </div>
    </div>

    <!-- 间距块：把四宫格卡顶精确推到源图实测的 y=188。
         头部块占位到 124，本块 124..138，卡片 mt 50 → 卡顶 188。 -->
    <div class="h-[14px]" style="flex:0 0 14px"></div>

    <!-- ===== 快捷入口（一行四列）：源图实测卡体 y=188..285（高 97）；
         图标圆直径 46px、逻辑 y=210.7..256.3；文字带约 265..285（中心 ≈274）。
         渲染实测：图标圆 213.3..259.3、文字中心 274.5（误差 ≤3px） ===== -->
    <div class="mx-4 mt-[50px] bg-white rounded-2xl shadow-sm flex items-center pt-[23px]" style="height:97px;flex:0 0 97px">
      <a href="profile.html" class="press cursor-pointer flex-1 flex flex-col items-center gap-[7px]">
        <span class="w-[46px] h-[46px] rounded-full bg-[#EAF4F6] flex items-center justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8.2 5.4 3h13.2L21 8.2v2.1a2.4 2.4 0 0 1-4.5 1.1 2.4 2.4 0 0 1-4.5 0 2.4 2.4 0 0 1-4.5 0A2.4 2.4 0 0 1 3 10.3V8.2Z"/><path d="M5 11.6V20h14v-8.4"/></svg>
        </span>
        <span class="text-[11px] text-ink-1">我的会员卡</span>
      </a>
      <a href="profile.html" class="press cursor-pointer flex-1 flex flex-col items-center gap-[7px]">
        <span class="w-[46px] h-[46px] rounded-full bg-[#EAF4F6] flex items-center justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6.5h18v11H3z"/><path d="M3 6.5 12 13l9-6.5"/><path d="M8.5 12.6v4.9"/></svg>
        </span>
        <span class="text-[11px] text-ink-1">我的优惠券</span>
      </a>
      <a href="profile.html" class="press cursor-pointer flex-1 flex flex-col items-center gap-[7px]">
        <span class="w-[46px] h-[46px] rounded-full bg-[#EAF4F6] flex items-center justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><rect x="3.4" y="9.6" width="17.2" height="10.4" rx="1.6"/><path d="M2.6 6.4h18.8v3.2H2.6z"/><path d="M12 9.6V20"/><path d="M12 6.4S10.6 2.6 8.2 2.6a1.9 1.9 0 0 0 0 3.8H12Zm0 0s1.4-3.8 3.8-3.8a1.9 1.9 0 0 1 0 3.8H12Z"/></svg>
        </span>
        <span class="text-[11px] text-ink-1">我的礼包</span>
      </a>
      <a href="profile.html" class="press cursor-pointer flex-1 flex flex-col items-center gap-[7px]">
        <span class="w-[46px] h-[46px] rounded-full bg-[#EAF4F6] flex items-center justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><path d="M7 3h10l4.2 6.4L12 21 2.8 9.4 7 3Z"/><path d="M2.8 9.4h18.4M12 21 8.6 9.4 12 3l3.4 6.4L12 21Z"/></svg>
        </span>
        <span class="text-[11px] text-ink-1">我的积分</span>
      </a>
    </div>

    <!-- ===== 分组一：我的合同 / 已约课程 / 我的体测 ===== -->
    <div class="mx-4 mt-[25px] bg-white rounded-2xl shadow-sm overflow-hidden">
      <a href="profile.html" class="press cursor-pointer flex items-center px-4" style="height:53px;flex:0 0 53px">
        <span class="w-[26px] flex justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><path d="M14 2.8H6.4A1.6 1.6 0 0 0 4.8 4.4v15.2a1.6 1.6 0 0 0 1.6 1.6h11.2a1.6 1.6 0 0 0 1.6-1.6V8.4L14 2.8Z"/><path d="M13.8 3v5.4h5.3"/><path d="M8.4 13.4h7.2M8.4 17h4.6"/></svg>
        </span>
        <span class="flex-1 ml-[13px] text-[15px] text-ink-1">我的合同</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#BBBBBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
      <div class="divider ml-4"></div>
      <a href="my-bookings.html" class="press cursor-pointer flex items-center px-4" style="height:53px;flex:0 0 53px">
        <span class="w-[26px] flex justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><rect x="3.2" y="5" width="17.6" height="16" rx="2.4"/><path d="M3.2 9.6h17.6M8 2.8v4M16 2.8v4"/><path d="M9.4 15.2l2 2 3.4-3.8"/></svg>
        </span>
        <span class="flex-1 ml-[13px] text-[15px] text-ink-1">已约课程</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#BBBBBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
      <div class="divider ml-4"></div>
      <a href="profile.html" class="press cursor-pointer flex items-center px-4" style="height:53px;flex:0 0 53px">
        <span class="w-[26px] flex justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="7" r="3.4"/><path d="M5.6 20.4c.4-3.6 3-5.6 6.4-5.6s6 2 6.4 5.6"/></svg>
        </span>
        <span class="flex-1 ml-[13px] text-[15px] text-ink-1">我的体测</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#BBBBBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
    </div>

    <!-- ===== 分组二：我的体验课 / 用户协议 / 隐私政策 ===== -->
    <div class="mx-4 mt-[25px] bg-white rounded-2xl shadow-sm overflow-hidden">
      <a href="my-trials.html" class="press cursor-pointer flex items-center px-4" style="height:53px;flex:0 0 53px">
        <span class="w-[26px] flex justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><path d="M4 20.4s.6-4.2 4-7.4c3.4-3.2 8-5.6 12-6.6-.8 4-3 8.6-6.2 12-3.2 3.4-7.4 4-7.4 4"/><path d="M8.4 15.6 3.6 10.8l4.2-1.4M12.6 19.8l4.8-4.8 1.4 4.2"/></svg>
        </span>
        <span class="flex-1 ml-[13px] text-[15px] text-ink-1">我的体验课</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#BBBBBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
      <div class="divider ml-4"></div>
      <a href="terms.html" class="press cursor-pointer flex items-center px-4" style="height:53px;flex:0 0 53px">
        <span class="w-[26px] flex justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><path d="M14 2.8H6.4A1.6 1.6 0 0 0 4.8 4.4v15.2a1.6 1.6 0 0 0 1.6 1.6h11.2a1.6 1.6 0 0 0 1.6-1.6V8.4L14 2.8Z"/><path d="M13.8 3v5.4h5.3"/><path d="M8.4 13h7.2M8.4 16.6h7.2"/></svg>
        </span>
        <span class="flex-1 ml-[13px] text-[15px] text-ink-1">用户协议</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#BBBBBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
      <div class="divider ml-4"></div>
      <a href="privacy.html" class="press cursor-pointer flex items-center px-4" style="height:53px;flex:0 0 53px">
        <span class="w-[26px] flex justify-center">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#609CE9" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8 4.6 5.8v6c0 4.4 3.1 8.2 7.4 9.4 4.3-1.2 7.4-5 7.4-9.4v-6L12 2.8Z"/><path d="M9.2 12.2l2.1 2.1 3.8-4.3"/></svg>
        </span>
        <span class="flex-1 ml-[13px] text-[15px] text-ink-1">隐私政策</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#BBBBBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </a>
    </div>

    <div class="h-[14px]"></div>
  </div>

  <!-- ============ 固定区 3：TabBar（一级页） ============ -->
  <div id="tabbar"></div>
</div>

<script src="assets/tabbar.js"></script>
<script>renderTabBar('me')</script>
</body>
</html>
