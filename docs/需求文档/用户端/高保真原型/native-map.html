<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信内置地图 · 一水瑜伽普拉提</title>
<!-- ============================================================
     微信原生页（非本产品开发）：微信内置地图 / 位置详情页
     源截图：docs/需求文档/用户端/用户端小程序截图/地图.png  1170x2532 @3x → 390x844
     ⚠ 本页保留「微信原生样式」：无产品导航栏、无胶囊按钮、无 TabBar
       （已按源图逐像素核对：右侧无微信胶囊，仅状态栏图标）
     固定区状态栏沿用 _骨架示例.html 的 44px 高度与左右分栏结构，
     但按源图改为黑色图标 + 透明底（地图顶到屏幕最上沿）。
     ============================================================ -->
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 地图画面：直接用原截图当雪碧图，切出源图 y=0..1782px（逻辑 0..594pt）
     390 宽显示 = 缩放到 1/3，故 background-position y = 0 */
  .map-sprite {
    background-image: url('../需求文档/用户端/用户端小程序截图/地图.png');
    background-size: 390px auto;
    background-position: 0 0;
    background-repeat: no-repeat;
  }
  /* 微信地图页返回按钮：白色圆形 + 浅灰箭头（源图 60x59px → 20x20pt） */
  .map-back {
    position: absolute;
    left: 18px; top: 59px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
</style>
</head>
<body>
<div class="phone">

  <!-- ============ 地图画面（含被覆盖的状态栏/导航区域，源图 y=0..1782） ============ -->
  <div class="map-sprite" style="position:absolute;left:0;top:0;width:390px;height:594px"></div>

  <!-- ============ 状态栏（浮在地图上，黑色图标） ============ -->
  <div class="statusbar" style="position:absolute;left:0;top:0;width:390px;background:transparent;z-index:2">
    <span style="display:flex;align-items:center;gap:5px">12:34
      <svg width="12" height="12" viewBox="0 0 16 16" fill="#000" style="flex:none"><path d="M15 1 1 6.6l5.6 2.1L15 1ZM7.1 9.6l1.6 5.4L15 1 7.1 9.6Z"/></svg>
    </span>
    <span class="sb-right">
      <svg width="17" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#000"><path d="M8 10.6 5.9 8.3a3.1 3.1 0 0 1 4.2 0L8 10.6Zm0-5.1c-1.5 0-2.9.5-4 1.5L2.6 5.6A7.9 7.9 0 0 1 8 3.4c2 0 3.9.8 5.4 2.2L12 7c-1.1-1-2.5-1.5-4-1.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#000"/><path d="M23 4.2v3.6c1-.3 1.4-.9 1.4-1.8s-.4-1.5-1.4-1.8Z" fill="#000" fill-opacity=".4"/></svg>
      <span style="font-size:12px;font-weight:600;margin-left:1px">62</span>
    </span>
  </div>

  <!-- 返回按钮（微信地图页原生，浮在地图上；只读展示，无跳转目标） -->
  <div class="map-back">
    <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="#C8C8C8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.4 1.2 1.6 6.5l4.8 5.3"/></svg>
  </div>

  <!-- ============ 底部地点信息卡（源图 y=1782..2532 → 逻辑 594..844） ============ -->
  <div style="position:absolute;left:0;top:594px;width:390px;height:250px;background:#fff;border-radius:9px 9px 0 0">

    <!-- 拖拽条：源图 y1818..1829，x525..644 -->
    <div style="position:absolute;left:175px;top:12px;width:40px;height:4px;border-radius:2px;background:#EDEDED"></div>

    <!-- 店名：源图 y1913..1969，x63 起，字高约 55px → 19pt -->
    <div style="position:absolute;left:21px;top:43px;font-size:19px;font-weight:600;color:#111;line-height:1;letter-spacing:0">一水·瑜伽普拉提 (双桥路店)</div>

    <!-- 地址：源图 y2003..2042，x62 起 -->
    <div style="position:absolute;left:20px;top:74px;font-size:14px;color:#666;line-height:1;letter-spacing:0">上海市浦东新区双桥路 937号 1_2层</div>

    <!-- 距离 / 车程 / 更多：源图 y2087..2124 -->
    <div style="position:absolute;left:20px;top:102px;height:17px;display:flex;align-items:center;font-size:13px;line-height:1;color:#111">
      <span>距你 6 公里</span>
      <span style="display:flex;align-items:center;margin-left:18px;color:#111">
        <svg width="13" height="10" viewBox="0 0 14 11" fill="#5B8FF9" style="margin-right:2px"><path d="M2 4.2 3.2 1.6A1.2 1.2 0 0 1 4.3 1h5.4a1.2 1.2 0 0 1 1.1.6L12 4.2c.6.1 1 .6 1 1.2v3.1c0 .4-.3.7-.7.7h-.6a.7.7 0 0 1-.7-.7V8H2.9v.5a.7.7 0 0 1-.7.7h-.5A.7.7 0 0 1 1 8.5V5.4c0-.6.4-1.1 1-1.2Zm1.4-.3h7.2l-.9-1.7a.4.4 0 0 0-.3-.2H4.6a.4.4 0 0 0-.4.2l-.8 1.7ZM3.2 5.6a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm7.6 0a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/></svg>
        <span>20 分钟</span>
      </span>
      <span style="margin-left:19px;color:#576B95">更多</span>
    </div>

    <!-- 操作按钮：源图 y2208..2327（逻辑 736..775.7，卡内偏移 142），4 个，宽 95pt、间距 8pt -->
    <div style="position:absolute;left:20px;top:142px;display:flex;gap:8px;font-size:14px;color:#191919">
      <!-- 导航 -->
      <div class="press cursor-pointer" style="width:95px;height:40px;border-radius:8px;background:#F2F2F2;display:flex;align-items:center;justify-content:center">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="#191919" style="margin-right:4px"><path d="M15 1 1 6.6l5.6 2.1L15 1ZM7.1 9.6l1.6 5.4L15 1 7.1 9.6Z"/></svg>导航
      </div>
      <!-- 打车 -->
      <div class="press cursor-pointer" style="width:95px;height:40px;border-radius:8px;background:#F2F2F2;display:flex;align-items:center;justify-content:center">
        <svg width="15" height="12" viewBox="0 0 14 11" fill="#191919" style="margin-right:4px"><path d="M2 4.2 3.2 1.6A1.2 1.2 0 0 1 4.3 1h5.4a1.2 1.2 0 0 1 1.1.6L12 4.2c.6.1 1 .6 1 1.2v3.1c0 .4-.3.7-.7.7h-.6a.7.7 0 0 1-.7-.7V8H2.9v.5a.7.7 0 0 1-.7.7h-.5A.7.7 0 0 1 1 8.5V5.4c0-.6.4-1.1 1-1.2Zm1.4-.3h7.2l-.9-1.7a.4.4 0 0 0-.3-.2H4.6a.4.4 0 0 0-.4.2l-.8 1.7ZM3.2 5.6a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm7.6 0a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/></svg>打车
      </div>
      <!-- 收藏 -->
      <div class="press cursor-pointer" style="width:95px;height:40px;border-radius:8px;background:#F2F2F2;display:flex;align-items:center;justify-content:center">
        <svg width="13" height="14" viewBox="0 0 14 15" fill="#191919" style="margin-right:4px"><path d="M7 .8 13.2 4v7L7 14.2.8 11V4L7 .8Zm0 3.1L4.3 5.3v3.4L7 10.2l2.7-1.5V5.3L7 3.9Z"/></svg>收藏
      </div>
      <!-- 更多 -->
      <div class="press cursor-pointer" style="width:40px;height:40px;border-radius:8px;background:#F2F2F2;display:flex;align-items:center;justify-content:center">
        <svg width="17" height="4" viewBox="0 0 17 4" fill="#191919"><circle cx="2" cy="2" r="1.7"/><circle cx="8.5" cy="2" r="1.7"/><circle cx="15" cy="2" r="1.7"/></svg>
      </div>
    </div>

  </div>

</div>
</body>
</html>
