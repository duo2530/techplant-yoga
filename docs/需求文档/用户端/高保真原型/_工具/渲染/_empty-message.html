<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>rasterize message empty-state illustration</title>
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #box{width:66px;height:52px;padding:0;}
  svg{display:block;}
</style>
</head>
<body>
  <div id="box">
    <svg width="66" height="52" viewBox="0 0 66 52" fill="none" aria-hidden="true">
      <!-- 山丘/底座 -->
      <path d="M0 52 C4 30 14 17 26 13 C39 9 52 13 59 21 C63 26 65 38 66 52 Z" fill="#E9E9E9"/>
      <!-- 飞碟/卫星：中灰，压在山丘之上 -->
      <ellipse cx="31" cy="14" rx="9" ry="3.4" fill="#8E8E8E"/>
      <!-- 云朵：浅灰（纯白在白底上不可见），绘于山丘之上 -->
      <ellipse cx="15" cy="24" rx="9" ry="5" fill="#DCDCDC"/>
      <ellipse cx="25" cy="21" rx="6.5" ry="4.2" fill="#DCDCDC"/>
      <ellipse cx="7" cy="23" rx="5.5" ry="3.8" fill="#DCDCDC"/>
      <!-- 图片占位图标：圆角方框 + 山峰 + 太阳 -->
      <rect x="36" y="24" width="22" height="17" rx="3" fill="#BDBDBD"/>
      <path d="M39 39 L45 31 L48 35 L52 32 L56 39 Z" fill="#F5F5F5"/>
      <circle cx="52" cy="29" r="2" fill="#F5F5F5"/>
    </svg>
  </div>
</body>
</html>
