<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动列表 · 一水瑜伽普拉提</title>
<!-- ① 三件套固定顺序：tailwind → tokens → app.css -->
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 本页实测色值（源自 二级页面-活动列表.png 像素采样，非估计值）
     内容区竖向渐变 顶 #E3F2FD → 底 #8FC9F9（源图 y=276..2525 采样线性拟合）
     空态图标描边 #AAAAAA（3925 个像素点众数，完全一致）
     空态文案    #AAAAAA */
  .act-empty-bg { background: linear-gradient(180deg, #E3F2FD 0%, #8FC9F9 100%); }
</style>
</head>
<body>
<div class="phone">

  <!-- ============ 固定区 1：状态栏 ============ -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#000"><path d="M8 10.6 5.9 8.3a3.1 3.1 0 0 1 4.2 0L8 10.6Zm0-5.1c-1.5 0-2.9.5-4 1.5L2.6 5.6A7.9 7.9 0 0 1 8 3.4c2 0 3.9.8 5.4 2.2L12 7c-1.1-1-2.5-1.5-4-1.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#000"/><path d="M23 4.2v3.6c1-.3 1.4-.9 1.4-1.8s-.4-1.5-1.4-1.8Z" fill="#000" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- ============ 固定区 2：导航栏（二级页：返回箭头，无 TabBar） ============ -->
  <div class="navbar">
    <a href="home.html" class="nav-back press cursor-pointer" aria-label="返回">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
    </a>
    <span class="nav-title">活动列表</span>
    <div class="capsule">
      <span class="cap-btn"><svg width="17" height="5" viewBox="0 0 17 5" fill="#333"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="8.5" cy="2.5" r="1.6"/><circle cx="14.5" cy="2.5" r="1.6"/></svg></span>
      <span class="cap-div"></span>
      <span class="cap-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="1.6" fill="#333" stroke="none"/></svg></span>
    </div>
  </div>

  <!-- ============ 可滚动内容区 ============ -->
  <!-- 截图「二级页面-活动列表.png」里**没有任何活动卡片、也没有筛选 Tab**，是空态页：
       导航栏下方整屏为浅蓝渐变，居中一个灰色图标 + 「暂无数据」。
       按 _复刻规范.md §1.2「空态也要复刻，不要塞假数据」，此处不编造卡片。 -->
  <div class="screen act-empty-bg flex flex-col items-center">

    <!-- 空态图标：源图 x 528..644 / y 669..775 → 逻辑 39 × 36，实测描边 #AAAAAA -->
    <svg class="mt-[135px] flex-none" width="39" height="36" viewBox="0 0 39 36"
         fill="none" stroke="#AAAAAA" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <!-- 圆角方框：右下角留缺口，让位给带减号的圆 -->
      <path d="M28 31.7H7.8A5.5 5.5 0 0 1 2.3 26.2V7.8A5.5 5.5 0 0 1 7.8 2.3H30.9A5.5 5.5 0 0 1 36.4 7.8V19.5"/>
      <!-- 三根竖条（中高、左中、右矮，底部对齐） -->
      <path d="M9.85 12.85V22.45M16.85 9.05V22.45M23.55 14.95V22.45" stroke-width="2.5"/>
      <!-- 右下角：圆 + 减号 -->
      <circle cx="32.15" cy="28.65" r="4.95"/>
      <path d="M29.9 28.65h4.5"/>
    </svg>

    <!-- 空态文案：源图 y 839..880 / x 498..672 → 逻辑 y 279.7 起、字高 14 -->
    <div class="mt-[20px] text-[15px] leading-none text-[#AAAAAA]">暂无数据</div>

  </div>

</div>
</body>
</html>
