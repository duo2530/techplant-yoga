<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申请体验 · 一水瑜伽普拉提</title>
<!-- ① 三件套固定顺序：tailwind → tokens → app.css -->
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 本页实测色值（像素采样，非估计）
     页面底 #FFFFFF / 表单标签与正文 #080808 / 占位符 #AAAAAA
     分割线 #E5E5E5 / 必填星号 #E83A30 / 按钮蓝 #87C7F6 / 底栏上边线 #F6F6F6 */
  .apply-field::placeholder { color: #AAAAAA; }
  .apply-field:focus { outline: none; }
  /* 选择门店：视觉上是被填好的选择器，点击展开原生 select */
  .store-select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  textarea.apply-field { resize: none; }
</style>
</head>
<body>
<div class="phone">

  <!-- ============ 固定区 1：状态栏 ============ -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#000"><path d="M8 10.6 5.9 8.3a3.1 3.1 0 0 1 4.2 0L8 10.6Zm0-5.1c-1.5 0-2.9.5-4 1.5L2.6 5.6A7.9 7.9 0 0 1 8 3.4c2 0 3.9.8 5.4 2.2L12 7c-1.1-1-2.5-1.5-4-1.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#000"/><path d="M23 4.2v3.6c1-.3 1.4-.9 1.4-1.8s-.4-1.5-1.4-1.8Z" fill="#000" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- ============ 固定区 2：导航栏（二级页：返回箭头，无 TabBar） ============ -->
  <div class="navbar">
    <a href="home.html" class="nav-back press cursor-pointer" aria-label="返回">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
      <span>返回</span>
    </a>
    <span class="nav-title">申请体验</span>
    <div class="capsule">
      <span class="cap-btn"><svg width="17" height="5" viewBox="0 0 17 5" fill="#333"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="8.5" cy="2.5" r="1.6"/><circle cx="14.5" cy="2.5" r="1.6"/></svg></span>
      <span class="cap-div"></span>
      <span class="cap-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="1.6" fill="#333" stroke="none"/></svg></span>
    </div>
  </div>

  <!-- ============ 可滚动内容区 ============ -->
  <div class="screen">
    <!-- 表单 + 下方留白：源图 y=234..1056/3 = 78..352（表单），352+64 留白到 416 -->
    <div style="min-height:633px;background:#FFFFFF">

      <!-- 表单第 1 行：选择门店（源图 y=167..233 分隔线内） -->
      <form action="home.html" method="get">
        <div class="relative flex items-center" style="height:56.3px;padding:0 14.7px">
          <span class="flex-none text-[15px] text-[#080808] leading-none" style="width:70px">选择门店<span class="text-[#E83A30]" style="margin-left:1px">*</span></span>
          <span class="flex-1 text-[15px] text-[#080808] leading-none truncate">瑜伽普拉提 (双桥路店)</span>
          <svg class="flex-none ml-2" width="6" height="4" viewBox="0 0 6 4" fill="#AAAAAA" aria-hidden="true"><path d="M0 4 3 0l3 4z"/></svg>
          <select class="store-select" aria-label="选择门店">
            <option selected>瑜伽普拉提 (双桥路店)</option>
          </select>
        </div>
        <div style="height:1px;background:#E5E5E5"></div>

        <!-- 表单第 2 行：姓名 -->
        <div class="flex items-center" style="height:56.3px;padding:0 14.7px">
          <svg class="flex-none mr-[6px]" width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="#AAAAAA" stroke-width="1" aria-hidden="true">
            <rect x="0.5" y="0.5" width="11" height="9" rx="1.6"/>
            <path d="M2.6 3.1h3.3M2.6 5h3.3M2.6 6.9h3.3" stroke-linecap="round"/>
            <circle cx="8.6" cy="4" r="1.35"/>
            <path d="M6.7 8.1c.1-1.2 1-1.9 1.9-1.9s1.8.7 1.9 1.9" stroke-linecap="round"/>
          </svg>
          <span class="flex-none text-[15px] text-[#080808] leading-none" style="width:63px">姓名</span>
          <input class="apply-field flex-1 min-w-0 border-0 bg-transparent text-[15px] text-[#080808] leading-none" type="text" placeholder="请输入姓名" aria-label="姓名">
        </div>
        <div style="height:1px;background:#E5E5E5"></div>

        <!-- 表单第 3 行：手机号码 -->
        <div class="flex items-center" style="height:56.3px;padding:0 14.7px">
          <span class="flex-none text-[15px] text-[#080808] leading-none" style="width:70px">手机号码<span class="text-[#E83A30]" style="margin-left:1px">*</span></span>
          <input class="apply-field flex-1 min-w-0 border-0 bg-transparent text-[15px] text-[#080808] leading-none" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号码" aria-label="手机号码">
          <svg class="flex-none ml-2" width="9" height="13" viewBox="0 0 9 13" fill="none" stroke="#AAAAAA" stroke-width="1" aria-hidden="true">
            <rect x="0.5" y="0.5" width="8" height="12" rx="1.6"/>
            <circle cx="4.5" cy="10.6" r="0.7" fill="#AAAAAA" stroke="none"/>
          </svg>
        </div>
        <div style="height:1px;background:#E5E5E5"></div>

        <!-- 表单第 4 行：留言（多行，行高明显更大；源图 y=280..352） -->
        <div class="flex items-start" style="padding:20px 14.7px 0">
          <span class="flex-none text-[15px] text-[#080808]" style="width:122.7px;padding-top:3px;line-height:18px">留言</span>
          <textarea class="apply-field flex-1 min-w-0 border-0 bg-transparent text-[15px] text-[#080808]" rows="1" style="line-height:18px" placeholder="请留言" aria-label="留言"></textarea>
        </div>
        <div style="height:1px;background:#E5E5E5"></div>
      </form>

    </div>
  </div>

  <!-- ============ 固定区 3：底部操作栏 ============
       真机实测：栏顶边 y≈750pt（源图 y=2249 处有一条 #F6F6F6 上边线），
       按钮区 y=757..795pt（源图 y=2270..2385），按钮本体 34pt 高（源图 2282..2383）；
       按钮下方 y=795..844 是空白的 Home Indicator 安全区。
       所以栏整体高 94pt，内容靠上排、底部留 49pt 安全区。 -->
  <div class="absolute left-0 bottom-0 w-full bg-white" style="height:94px;border-top:1px solid #F6F6F6">
    <div class="flex items-center" style="height:44px;padding:0 15px">
      <a href="my-bookings.html" class="press cursor-pointer flex flex-col items-center justify-center flex-none" style="width:56px" aria-label="我的预约">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="#AAAAAA" aria-hidden="true">
          <g transform="rotate(-42 8 8)">
            <path d="M3.1 4.7A1.6 1.6 0 0 1 4.7 3.1h6.6a1.6 1.6 0 0 1 1.6 1.6v6.6a1.6 1.6 0 0 1-1.6 1.6H4.7a1.6 1.6 0 0 1-1.6-1.6z"/>
            <rect x="5.8" y="4.3" width="1.1" height="7.4" fill="#FFFFFF" transform="rotate(16 6.35 8)"/>
            <rect x="9.1" y="4.3" width="1.1" height="7.4" fill="#FFFFFF" transform="rotate(16 9.65 8)"/>
          </g>
        </svg>
        <span class="text-[10px] text-[#AAAAAA] leading-none whitespace-nowrap" style="margin-top:4px">我的预约</span>
      </a>
      <a href="home.html" class="press cursor-pointer bg-brand-light text-white text-[17px] font-medium flex items-center justify-center" style="height:34px;border-radius:17px;margin-left:auto;width:284px">立即预约</a>
    </div>
  </div>

</div>
</body>
</html>
