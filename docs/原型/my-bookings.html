<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的预约 · 一水瑜伽普拉提</title>
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 每个页面自带雪碧图工具类：固定 390 宽 = 源图 1170 的 1/3 */
  .sprite { background-repeat: no-repeat; background-size: 390px auto; }
</style>
</head>
<body>
<div class="phone">

  <!-- ============ 固定区 1：状态栏 ============ -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#000"><path d="M8 10.6 5.9 8.3a3.1 3.1 0 0 1 4.2 0L8 10.6Zm0-5.1c-1.5 0-2.9.5-4 1.5L2.6 5.6A7.9 7.9 0 0 1 8 3.4c2 0 3.9.8 5.4 2.2L12 7c-1.1-1-2.5-1.5-4-1.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#000"/><path d="M23 4.2v3.6c1-.3 1.4-.9 1.4-1.8s-.4-1.5-1.4-1.8Z" fill="#000" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- ============ 固定区 2：导航栏（一级页，无返回箭头） ============ -->
  <div class="navbar">
    <span class="nav-title">我的预约</span>
    <div class="capsule">
      <span class="cap-btn"><svg width="17" height="5" viewBox="0 0 17 5" fill="#333"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="8.5" cy="2.5" r="1.6"/><circle cx="14.5" cy="2.5" r="1.6"/></svg></span>
      <span class="cap-div"></span>
      <span class="cap-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="1.6" fill="#333" stroke="none"/></svg></span>
    </div>
  </div>

  <!-- ============ 可滚动内容区 ============ -->
  <div class="screen bg-page">

    <!-- 上方白色区：状态筛选 Tab + 计数/下拉筛选栏（两者同处一块白底，下接灰底空态） -->
    <div class="bg-white">

      <!-- 状态筛选 Tab：全部 / 已预约 / 已取消 / 已签到（"全部"为选中态，蓝色下划线） -->
      <div class="flex items-end h-[52px] px-4">
        <a href="my-bookings.html" class="press cursor-pointer flex-1 flex flex-col items-center gap-[7px]">
          <span class="text-[15px] font-semibold text-ink-1">全部</span>
          <span class="w-[24px] h-[3px] rounded-full bg-brand"></span>
        </a>
        <a href="my-bookings.html" class="press cursor-pointer flex-1 flex flex-col items-center gap-[7px]">
          <span class="text-[15px] text-ink-3">已预约</span>
          <span class="w-[24px] h-[3px] rounded-full bg-transparent"></span>
        </a>
        <a href="my-bookings.html" class="press cursor-pointer flex-1 flex flex-col items-center gap-[7px]">
          <span class="text-[15px] text-ink-3">已取消</span>
          <span class="w-[24px] h-[3px] rounded-full bg-transparent"></span>
        </a>
        <a href="my-bookings.html" class="press cursor-pointer flex-1 flex flex-col items-center gap-[7px]">
          <span class="text-[15px] text-ink-3">已签到</span>
          <span class="w-[24px] h-[3px] rounded-full bg-transparent"></span>
        </a>
      </div>

      <!-- 计数 + 两个下拉筛选 -->
      <div class="flex items-center justify-between px-4 h-[44px]">
        <div class="flex items-baseline gap-[3px]">
          <span class="text-[15px] font-semibold text-ink-1">0</span>
          <span class="text-[13px] text-ink-3">条预约</span>
        </div>
        <div class="flex items-center gap-2">
          <!-- 下拉 1：课种（截图原文显示"全部..."；左侧为蓝色文档/列表图标） -->
          <a href="my-bookings.html" class="press cursor-pointer flex items-center gap-[3px] h-[28px] px-2 rounded-[6px] border border-line bg-white">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#609CE9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="1.9" width="10.8" height="12.2" rx="1.4"/><path d="M5.2 5.2h5.6M5.2 7.8h5.6M5.2 10.4h3.4"/></svg>
            <span class="text-[12px] text-ink-2">全部...</span>
            <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.2 5 6.8l3.5-3.6"/></svg>
          </a>
          <!-- 下拉 2：卡种（截图原文显示"全部..."；左侧为蓝色漏斗图标） -->
          <a href="my-bookings.html" class="press cursor-pointer flex items-center gap-[3px] h-[28px] px-2 rounded-[6px] border border-line bg-white">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#609CE9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.4h12l-4.6 5.4v4.2l-2.8 1.4V8.8L2 3.4Z"/></svg>
            <span class="text-[12px] text-ink-2">全部...</span>
            <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.2 5 6.8l3.5-3.6"/></svg>
          </a>
        </div>
      </div>

    </div>

    <!-- 空态：源图实测（坐标均为逻辑值 = 源图像素 ÷3）
         · 白色方形容器 109×109，位于 y=365..474、水平居中（x=140.7..249.3）
           —— 独立复核（近纯白包围盒 x=422..748px / y=1095..1421px ÷3）与此一致
         · 插画墨迹实测 x=156.0..234.3（宽 78.7）、y=386..442（两段墨迹带 386..404 / 416..434）；
           在容器内**水平居中**（容器 140.7..249.3，插画左右各留 ~15px），距容器顶 21px
         · 标题「暂无符合条件的预约」文字带 y=491..505（中心 498.3）
         · 副标题「可切换预约状态、课种或卡种查看」y=517..528（中心 522.5）
         渲染实测：白盒 365..473、插画墨迹 x=192..249→已居中、y=386..442、
                   标题中心 498.5、副标题中心 523.0
         两个坑：① 容器必须正方形，否则插画被下边缘硬切（早前 138×56 的宽扁盒会切）；
         ② 雪碧图必须按**绝对逻辑坐标**定位 —— background-position:-156px -386px，
         绝不能用 50% 居中（背景图宽 390px，50% 会被解释为 (390-138)/2=126 而右移被裁）。 -->
    <div class="flex flex-col items-center pt-[181px]">
      <div class="w-[109px] h-[109px] bg-white flex justify-center" style="padding-top:21px">
        <div class="w-[138px] h-[56px] sprite" style="background-image:url('../需求文档/小程序截图/我的预约.png');background-position:-156px -386px;background-repeat:no-repeat"></div>
      </div>
      <div class="mt-[13px] text-[16px] text-ink-1">暂无符合条件的预约</div>
      <div class="mt-[2px] text-[13px] text-ink-3">可切换预约状态、课种或卡种查看</div>
    </div>

  </div>

  <!-- ============ 固定区 3：TabBar（一级页） ============ -->
  <div id="tabbar"></div>
</div>

<script src="assets/tabbar.js"></script>
<script>renderTabBar('booked')</script>
</body>
</html>
