<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一水·瑜伽普拉提 · 高保真原型总览</title>
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<style>
  body { background: #1B1F27; }
  .stage { display: grid; grid-template-columns: repeat(auto-fill, 390px); gap: 28px 24px; justify-content: center; }
  .frame {
    width: 390px; height: 844px; border: 0; border-radius: 12px; display: block;
    background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  .card { display: flex; flex-direction: column; gap: 10px; }
  .meta { display: flex; align-items: baseline; gap: 8px; }
  .code {
    font: 600 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .5px;
    color: #7C8798; background: #262C36; border-radius: 4px; padding: 4px 6px;
  }
  .name { font-size: 14px; font-weight: 600; color: #E8ECF2; }
  .tag { font-size: 11px; color: #7C8798; }
  .open { font-size: 11px; color: #609CE9; text-decoration: none; margin-left: auto; }
  .open:hover { text-decoration: underline; }
  .sec-title { color: #E8ECF2; font-size: 17px; font-weight: 700; }
  .sec-sub { color: #7C8798; font-size: 12px; }
  .rule { height: 1px; background: #2B323D; margin: 18px 0 26px; }
  .badge { font-size: 11px; border-radius: 999px; padding: 3px 9px; font-weight: 600; }
  .b-lv1 { background: #1E3A5F; color: #7FB6F0; }
  .b-lv2 { background: #2A3340; color: #9AA6B6; }
  .b-wx  { background: #1F3A2A; color: #5FD08A; }
</style>
</head>
<body class="min-h-screen py-10 px-6">

<header class="max-w-[1720px] mx-auto mb-8">
  <h1 class="text-white text-[22px] font-bold tracking-wide">一水·瑜伽普拉提 · 高保真原型</h1>
  <p class="text-[#7C8798] text-[13px] mt-2 leading-relaxed">
    依据 21 张真机截图复刻 · 画布 390×844（源图 1170×2532 @3x）· HTML + Tailwind CSS<br>
    色值取自截图真实像素采样，照片用「雪碧图法」直接从原截图切出，未改动原始截图文件。
  </p>
</header>

<main class="max-w-[1720px] mx-auto">

  <!-- ================= 一级页面 ================= -->
  <section>
    <div class="flex items-center gap-3">
      <span class="badge b-lv1">一级页面</span>
      <span class="sec-title">带底部 TabBar</span>
      <span class="sec-sub">首页 / 约课 / 已约 / 我的</span>
    </div>
    <div class="rule"></div>
    <div class="stage" id="stage-lv1"></div>
  </section>

  <div class="h-16"></div>

  <!-- ================= 二级页面 ================= -->
  <section>
    <div class="flex items-center gap-3">
      <span class="badge b-lv2">二级页面</span>
      <span class="sec-title">压栈页，无 TabBar</span>
      <span class="sec-sub">共 11 个</span>
    </div>
    <div class="rule"></div>
    <div class="stage" id="stage-lv2"></div>
  </section>

  <div class="h-16"></div>

  <!-- ================= 微信原生 ================= -->
  <section>
    <div class="flex items-center gap-3">
      <span class="badge b-wx">微信原生</span>
      <span class="sec-title">非本产品开发</span>
      <span class="sec-sub">样式与产品页不同是正常的</span>
    </div>
    <div class="rule"></div>
    <div class="stage" id="stage-wx"></div>
  </section>

</main>

<script>
  const PAGES = {
    lv1: [
      ['home.html',        'P1  首页',      '入口聚合页 · 三屏内容'],
      ['booking.html',     'P2  约课',      '业务中枢 · 4 品类 + 14 天日期条'],
      ['my-bookings.html', 'P3  我的预约',  'TabBar 文案为「已约」'],
      ['profile.html',     'P4  我的',      '个人中心']
    ],
    lv2: [
      ['trial-apply.html',    'P5  申请体验',      '表单'],
      ['my-trials.html',      'P6  我的体验课',    '审核状态'],
      ['share-poster.html',   'P7  分享海报',      '横向轮播'],
      ['activities.html',     'P8  活动列表',      ''],
      ['coaches.html',        'P9  约教练',        ''],
      ['messages.html',       'P10 消息',          ''],
      ['terms.html',          'P11 用户协议',      '长文'],
      ['privacy.html',        'P12 隐私协议',      '长文'],
      ['quick-login.html',    'P13 快速登录页',    '登录门入口'],
      ['phone-auth.html',     'P14 手机号登录/注册','同页两个 Tab'],
      ['forgot-password.html','P15 忘记密码',      '']
    ],
    wx: [
      ['native-map.html',      'W1  微信内置地图页', 'wx.openLocation'],
      ['native-location.html', 'W2  位置授权弹窗',   'wx.getLocation']
    ]
  };

  const BADGE = { lv1: '一级', lv2: '二级', wx: '原生' };

  for (const [group, list] of Object.entries(PAGES)) {
    const host = document.getElementById('stage-' + group);
    host.innerHTML = list.map(([file, name, note]) => `
      <div class="card">
        <div class="meta">
          <span class="code">${BADGE[group]}</span>
          <span class="name">${name}</span>
          <a class="open" href="${file}" target="_blank">单独打开 ↗</a>
        </div>
        <div class="tag">${note}</div>
        <iframe class="frame" src="${file}" loading="lazy" title="${name}"></iframe>
      </div>
    `).join('');
  }
</script>

</body>
</html>
