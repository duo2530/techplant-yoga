<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机号登录/注册 · 一水瑜伽普拉提</title>
<!-- ============================================================================
  页面：手机号登录 / 注册（二级页，无 TabBar）—— 同一页的两个 Tab，可点击切换
  截图：docs/需求文档/用户端/用户端小程序截图/手机登录页.png（登录 Tab，默认）＋ 手机注册页.png（注册 Tab）

  【还原依据（全部为源图像素实测，源图 1170×2532 @3x → 逻辑 390×844）】
  - 导航栏：与「快速登录页」相同 —— 左侧灰色胶囊「‹ ｜ ⌂」(85×32, rgba(0,0,0,.15), 图标纯白)，
    中间**无标题**，右侧微信胶囊。三张登录截图里都看不到标题文字（已用像素扫描确认 y250-618 无文字）。
  - 页面背景：上部为蓝色（顶部 #8AC1E6，右上偏青 #85CEDC），往下渐变为极淡蓝白（#C6E2F1 → #EEF5FB）。
  - 分段控件（Tab）：逻辑 x71.7–318.3（居中）、y208–247.7，即 246.7×40，圆角 20 的胶囊；
    选中半边是浅蓝渐变 linear-gradient(90deg,#CDE8FD,#9DD1F8)，未选中半边近白 #F2F9FC；
    文字 15px、字距 6px、文案「登 录」「注 册」（截图里两字之间有明显的宽间距）。
  - 白色卡片：逻辑 x15–375（左右各留 15）、圆角 10、底色 #F8FCFD，内边距 上下 45 / 左右 26；
    登录态卡片 y302–605.7（内含 2 个输入框 + 按钮 + 一行链接），注册态卡片 y302–625.7（3 个输入框 + 按钮，无链接行）。
  - 输入框：308×40，圆角 20（胶囊），1px 边框 #C6D1D8，左图标 #78909C，占位符 14px #C6D1D8；
    框间距 30.3；输入框 → 主按钮间距 39。
  - 主按钮：308×40，圆角 20，实测纯色 #87C7F6，白字 14px、字距 6px（「登 录」/「注 册」）。
  - 登录态多一行：左「快捷登录」(#87C7F6) + 右「忘记密码？」(#AAAAAA)，14px，两端对齐；
    注册态没有这一行（像素确认 y1810-2072 无文字）。
  - 卡片下方：未勾选圆框（17px，1px #AAAAAA 边框）+「已阅读并同意“用户协议”和“隐私政策”各条款」
    (#080808，14px)，卡片底到该行间距 65。
  - 注册态第 2 个输入框右侧有「获取验证码」小按钮：97.3×23.7，圆角 12，
    渐变 linear-gradient(90deg,#76B7EB,#3F81C7)，白字 11px。

  【不确定 / 需要评审确认】
  1) **两张截图的“选中 Tab 文字颜色”互相矛盾**（均已像素确认，不是看错）：
     手机登录页.png 里选中的「登 录」是深灰蓝 #78909C（该区域 835 个深色像素、0 个白色像素）；
     手机注册页.png 里选中的「注 册」是纯白 #FFFFFF（1243 个白色像素、0 个深色像素）。
     本文件按“复刻而非重设计”的原则**分别照各自截图还原**（见下方 #tabLogin.on / #tabRegister.on），
     所以切换 Tab 时选中文字颜色会从深灰蓝变成白。若判定其中一张是旧版本、需要统一，改这两行 CSS 即可。
  2) 第 2 个输入框（验证码）的左侧小图标：`vision` 三次读取都判断为 `</>` 形代码符号，
     实测墨迹 18.7×14.3，与 `</>` 形状吻合；但该字段通常应是「盾牌/短信」类图标，未能再复核（vision 随后不可用），
     故此处按 `</>` 绘制，属**低置信**项。
  3) 注册态第 3 个输入框占位符：实测 7 个字宽（102pt ÷ 14 ≈ 7），vision 读作「请输入登录密码」，
     与登录态密码框的占位符相同（疑为产品照抄，非笔误），此处按 vision 结果照抄。
  4) 输入框内已输入文字的颜色截图里不存在，暂用正文色 #080808；密码框的“闭眼”图标不可点击（截图无展开态）。
============================================================================ -->
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  .page-bg {
    background:
      radial-gradient(150% 80% at 104% -8%, rgba(132, 206, 220, 1) 0%, rgba(132, 206, 220, 0) 62%),
      radial-gradient(140% 190% at 108% 24%, rgba(230, 245, 252, .32) 0%, rgba(230, 245, 252, 0) 72%),
      linear-gradient(180deg, #8AC1E6 0%, #8AC1E6 30%, #93C5E3 40%, #C6E2F1 71%, #D8ECF7 85%, #EEF5FB 100%);
  }
  /* 导航栏左侧灰色「返回｜主页」胶囊 */
  .pill-nav {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 85px;
    height: 32px;
    border-radius: 16px;
    background: rgba(0, 0, 0, .15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px 0 17px;
  }
  .pill-nav .pill-div { width: .5px; height: 17px; background: rgba(255, 255, 255, .9); }

  /* 分段控件（登录 / 注册） */
  .seg {
    margin: 120px auto 0;
    width: 246.7px;
    height: 40px;
    border-radius: 20px;
    background: #F2F9FC;
    display: flex;
    overflow: hidden;
  }
  .seg-btn {
    flex: 1;
    border: 0;
    background: transparent;
    font-size: 15px;
    letter-spacing: 6px;
    text-indent: 6px;           /* 抵掉最后一个字后面的字距，保证视觉居中 */
    color: #78909C;
    cursor: pointer;
  }
  .seg-btn.on { background: linear-gradient(90deg, #CDE8FD, #9DD1F8); }
  /* ↓ 两行分别是两张截图的实测选中色，故意不一致，见文件顶部说明 1) */
  #tabLogin.on { color: #78909C; }
  #tabRegister.on { color: #FFFFFF; }

  /* 卡片与表单 */
  .card { margin: 54px auto 0; width: 360px; border-radius: 10px; background: #F8FCFD; padding: 45px 26px 20px; }
  .field {
    height: 40px;
    border: 1px solid #C6D1D8;
    border-radius: 20px;
    display: flex;
    align-items: center;
    padding: 0 17px 0 19px;
    gap: 10px;
    background: transparent;
  }
  .field + .field { margin-top: 30.3px; }
  .field .icon-slot { width: 18px; display: flex; justify-content: center; flex: none; }
  .field input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 14px;
    color: #080808;
    font-family: inherit;
  }
  .field input::placeholder { color: #C6D1D8; }
  .btn-blue {
    margin-top: 39.3px;
    width: 100%;
    height: 40px;
    border: 0;
    border-radius: 20px;
    background: #87C7F6;
    color: #fff;
    font-size: 14px;
    letter-spacing: 6px;
    text-indent: 6px;
    cursor: pointer;
  }
  /* 「获取验证码」小按钮：实测 97.3×23.7 圆角 12 蓝色渐变 */
  .sms-btn {
    flex: none;
    width: 98px;
    height: 24px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(90deg, #76B7EB, #3F81C7);
    color: #fff;
    font-size: 11px;
    letter-spacing: 0;
    cursor: pointer;
  }
  .links-row { margin-top: 37px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; line-height: 14px; }
  .agree-box { width: 17px; height: 17px; border: 1px solid #AAAAAA; border-radius: 50%; display: inline-block; flex: none; }
</style>
</head>
<body>
<div class="phone page-bg">

  <!-- ============ 固定区 1：状态栏 ============ -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#000"><path d="M8 10.6 5.9 8.3a3.1 3.1 0 0 1 4.2 0L8 10.6Zm0-5.1c-1.5 0-2.9.5-4 1.5L2.6 5.6A7.9 7.9 0 0 1 8 3.4c2 0 3.9.8 5.4 2.2L12 7c-1.1-1-2.5-1.5-4-1.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#000"/><path d="M23 4.2v3.6c1-.3 1.4-.9 1.4-1.8s-.4-1.5-1.4-1.8Z" fill="#000" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- ============ 固定区 2：导航栏（无标题，左侧灰色胶囊，右侧微信胶囊） ============ -->
  <div class="navbar">
    <div class="pill-nav">
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1 1 7l6 6"/></svg>
      <span class="pill-div"></span>
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 6.6 8 2.1l5.6 4.5v6.3a.9.9 0 0 1-.9.9H3.3a.9.9 0 0 1-.9-.9V6.6Z"/><path d="M6.3 13.8v-3.5h3.4v3.5"/></svg>
    </div>
    <div class="capsule">
      <span class="cap-btn"><svg width="17" height="5" viewBox="0 0 17 5" fill="#333"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="8.5" cy="2.5" r="1.6"/><circle cx="14.5" cy="2.5" r="1.6"/></svg></span>
      <span class="cap-div"></span>
      <span class="cap-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="1.6" fill="#333" stroke="none"/></svg></span>
    </div>
  </div>

  <!-- ============ 内容区 ============ -->
  <div class="screen">

    <!-- 分段控件：登录 / 注册（可点击切换，默认登录） -->
    <div class="seg" role="tablist">
      <button type="button" id="tabLogin" class="seg-btn on press" role="tab" aria-selected="true">登 录</button>
      <button type="button" id="tabRegister" class="seg-btn press" role="tab" aria-selected="false">注 册</button>
    </div>

    <!-- ========== 状态 1：登录 ========== -->
    <div id="cardLogin" class="card" style="padding-bottom:18px">

      <!-- 手机号 -->
      <div class="field">
        <span class="icon-slot">
          <svg width="14" height="19" viewBox="0 0 14 19" fill="none" stroke="#78909C" stroke-width="1.3"><rect x="0.65" y="0.65" width="12.7" height="17.7" rx="2.3"/><circle cx="7" cy="15.4" r="0.95" fill="#78909C" stroke="none"/></svg>
        </span>
        <input type="tel" inputmode="numeric" placeholder="请输入登录手机号码">
      </div>

      <!-- 密码 -->
      <div class="field">
        <span class="icon-slot">
          <svg width="17" height="19" viewBox="0 0 17 19" fill="none" stroke="#78909C" stroke-width="1.3"><rect x="1.15" y="7.15" width="14.7" height="11.2" rx="2.4"/><path d="M4.7 7V5.3a3.8 3.8 0 0 1 7.6 0V7"/><circle cx="8.5" cy="12.7" r="1.2" fill="#78909C" stroke="none"/></svg>
        </span>
        <input type="password" placeholder="请输入登录密码">
        <span class="icon-slot" style="width:17px">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#78909C" stroke-width="1.3" stroke-linecap="round"><path d="M1 3.2c2.4 2.6 4.9 3.9 7.5 3.9s5.1-1.3 7.5-3.9"/><path d="M4.1 6.3 3 8.5"/><path d="M8.5 7.2v2.3"/><path d="M12.9 6.3l1.1 2.2"/></svg>
        </span>
      </div>

      <button type="button" class="btn-blue press">登 录</button>

      <!-- 底部两个链接（仅登录态有） -->
      <div class="links-row">
        <a href="quick-login.html" class="press cursor-pointer" style="color:#87C7F6">快捷登录</a>
        <a href="forgot-password.html" class="press cursor-pointer" style="color:#AAAAAA">忘记密码？</a>
      </div>
    </div>

    <!-- ========== 状态 2：注册 ========== -->
    <div id="cardRegister" class="card hidden">

      <!-- 手机号 -->
      <div class="field">
        <span class="icon-slot">
          <svg width="14" height="19" viewBox="0 0 14 19" fill="none" stroke="#78909C" stroke-width="1.3"><rect x="0.65" y="0.65" width="12.7" height="17.7" rx="2.3"/><circle cx="7" cy="15.4" r="0.95" fill="#78909C" stroke="none"/></svg>
        </span>
        <input type="tel" inputmode="numeric" placeholder="请输入注册手机号码">
      </div>

      <!-- 验证码 + 获取验证码 -->
      <div class="field" style="padding-right:10px">
        <span class="icon-slot">
          <svg width="19" height="15" viewBox="0 0 19 15" fill="none" stroke="#78909C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 2.6 1.4 7.5l3.8 4.9"/><path d="M13.8 2.6l3.8 4.9-3.8 4.9"/><path d="M11.1 1.6 7.9 13.4"/></svg>
        </span>
        <input type="text" inputmode="numeric" placeholder="请输入验证码">
        <button type="button" class="sms-btn press">获取验证码</button>
      </div>

      <!-- 密码 -->
      <div class="field">
        <span class="icon-slot">
          <svg width="17" height="19" viewBox="0 0 17 19" fill="none" stroke="#78909C" stroke-width="1.3"><rect x="1.15" y="7.15" width="14.7" height="11.2" rx="2.4"/><path d="M4.7 7V5.3a3.8 3.8 0 0 1 7.6 0V7"/><circle cx="8.5" cy="12.7" r="1.2" fill="#78909C" stroke="none"/></svg>
        </span>
        <input type="password" placeholder="请输入登录密码">
        <span class="icon-slot" style="width:17px">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#78909C" stroke-width="1.3" stroke-linecap="round"><path d="M1 3.2c2.4 2.6 4.9 3.9 7.5 3.9s5.1-1.3 7.5-3.9"/><path d="M4.1 6.3 3 8.5"/><path d="M8.5 7.2v2.3"/><path d="M12.9 6.3l1.1 2.2"/></svg>
        </span>
      </div>

      <button type="button" class="btn-blue press">注 册</button>
    </div>

    <!-- 协议行（两种状态共用，都在卡片下方） -->
    <div style="margin-top:65px;display:flex;align-items:center;justify-content:center;gap:6px">
      <span class="agree-box press cursor-pointer"></span>
      <span style="font-size:14px;line-height:17px;color:#080808">已阅读并同意“<a href="terms.html" class="press" style="color:inherit">用户协议</a>”和“<a href="privacy.html" class="press" style="color:inherit">隐私政策</a>”各条款</span>
    </div>

  </div>
</div>

<script>
(function () {
  var tabLogin = document.getElementById('tabLogin');
  var tabReg   = document.getElementById('tabRegister');
  var cardLogin = document.getElementById('cardLogin');
  var cardReg   = document.getElementById('cardRegister');

  function select(which) {
    var isLogin = (which === 'login');
    tabLogin.classList.toggle('on', isLogin);
    tabReg.classList.toggle('on', !isLogin);
    tabLogin.setAttribute('aria-selected', isLogin ? 'true' : 'false');
    tabReg.setAttribute('aria-selected', isLogin ? 'false' : 'true');
    cardLogin.classList.toggle('hidden', !isLogin);
    cardReg.classList.toggle('hidden', isLogin);
  }

  tabLogin.addEventListener('click', function () { select('login'); });
  tabReg.addEventListener('click', function () { select('register'); });

  select('login');   // 默认显示「登录」Tab（与 手机登录页.png 一致）
})();
</script>
</body>
</html>
