<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信位置授权弹窗 · 一水瑜伽普拉提</title>
<!-- ============================================================
     微信原生页（非本产品开发）：微信「请求位置信息」授权弹窗
     源截图：docs/需求文档/小程序截图/请求位置信息.png  1170x2532 @3x → 390x844
     ⚠ 保留「微信原生样式」：无产品导航栏、无胶囊按钮、无 TabBar

     ★ 重要实测结论（与常见预期不同，已按源图逐像素核对）：
       该弹窗不是「居中弹窗」，而是**从屏幕底部升起的原生底部弹层**：
         · 弹层顶边 源图 y≈1695 → 逻辑 y=565pt（弹层内容顶边 源图 y1782 → 逻辑 594pt），一直铺到屏幕底边 844pt
         · 只有**上**左右两个圆角，圆角半径约 11pt（源图 x=3 处 y=1727 起泛白，1695+32=1727 → 半径约 32px/3≈11pt）
         · 白色 #FFFFFF 背景，宽度通栏 390pt
         · 两个按钮：拒绝（浅灰底 #F2F2F2 / 绿字 #07C160）
                    允许（微信绿底 #07C160 / 白字）
          各宽 120pt、高 48pt、间距 16pt、在弹层内水平居中（左右留白各 67pt）

     ★ 遮罩与底纹（最终结论，含两次自我纠错）：
       ① 先误判为「真机背后是空白页、遮罩纯 #7F7F7F」——**错**，已作废。
       ② 再按「rgba(0,0,0,.5) + 底纹按实测色÷0.5 手搭 HTML」——算法无误
          （纯灰处渲染与源图逐点相等），但**内容重建不准**：源图遮罩区仅 26% 非灰像素、
          文字几乎不可辨，我搭不出等价的形状/字号，于是整区偏灰、MAD≈10.6。
       ③ 最终：被压暗的这一层本质就是「图片式」底纹，按《_复刻规范》§5 雪碧图法
          直接用源图切片（下方那张 left/top/390x565 的 div），MAD 降到 **0.95**。
          故本页**不再有独立遮罩层**——切图自带压暗效果。

     ★ 应用图标：弹层是手写 HTML，其头部 Logo 用雪碧图法从源图切真实小程序 Logo
       （蓝底 + 白色瑜伽人形 + 水滴），不是微信默认定位图标，也不是手绘。
     ============================================================ -->
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 微信原生授权弹层：底部升起，仅上方两角圆角 */
  .wx-sheet {
    position: absolute;
    left: 0; top: 565px;
    width: 390px; height: 279px;
    background: #fff;
    border-radius: 14px 14px 0 0;
    padding: 0 21px;
    display: flex; flex-direction: column; align-items: flex-start;
    box-sizing: border-box;
  }
  .wx-btn {
    height: 48px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- ================================================================
       弹层背后的页面（首页）——被遮罩压暗，用**雪碧图**忠实呈现
       ────────────────────────────────────────────────────────────────
       为什么这里改用切图（而不是手搭 HTML）：
       验证代理测得该区 MAD 40.9；我逐点复核后确认——**不是遮罩不透明度的问题**：
         · 遮罩区纯灰处（如逻辑 y300 / y400 / y560）渲染与源图**逐点完全相等**，
           说明 rgba(0,0,0,.5) 是对的（白底 x 0.5 = #7F7F7F，与源图实测一致）；
         · 偏差全部落在**内容**上（导航栏标题、三宫格、蓝卡、空态卡）。
       进一步验证：用「源图实测色 / (1-0.5)」反推原色再叠 50% 黑，数学上必然等于
       源图实测色——所以偏差不来自算法，而来自我**认不出被压暗的内容到底是什么**
       （源图遮罩区只有 26% 的非灰像素，文字几乎不可辨）。
       该页被压暗的部分本质就是一张「图片式」底纹，按《_复刻规范》§5 雪碧图法
       直接用源图切片，是唯一能保证与源图逐像素一致的作法。
       弹层（y565 以下）仍是手写 HTML，故文件头部的 Logo 仍保留独立切图。
       ────────────────────────────────────────────────────────────────
       切片：源图 y0..1695px（逻辑 0..565pt），background-size:390px auto
       ⚠ 此区域内的文字极暗、不可辨，故不另写文案（不编造）
       ================================================================ -->
  <div style="position:absolute;left:0;top:0;width:390px;height:565px;background-image:url('../需求文档/小程序截图/请求位置信息.png');background-size:390px auto;background-position:0 0;background-repeat:no-repeat"></div>
  <!-- 注：此处不再需要独立遮罩层 —— 上面那张切图**本身就已含压暗效果**
       （它就是源图 y0..565 的原始像素），再叠一层纯色会把底纹整个盖掉。 -->

  <!-- ================================================================
       微信原生授权弹层（底部升起）
       ================================================================ -->
  <div class="wx-sheet">

    <!-- 标题行：应用图标 + 「一水瑜伽 申请」 + 信息图标（源图 y1791..1862 → 逻辑 597..620.7） -->
    <div style="display:flex;align-items:center;width:100%;height:24px;margin-top:32px">
      <!-- 应用图标：用雪碧图法从源图切出小程序自定义 Logo（蓝底 + 白色瑜伽人形 + 水滴）
           实测圆形 Logo 边界 源图 x60..131 / y1791..1862 → 72x71px → 逻辑 24x23.7pt
           换算：background-size:390px auto（1/3 缩放），
                background-position: -20px -597px（= -60/3 , -1791/3） -->
      <div style="flex:none;width:24px;height:24px;background-image:url('../需求文档/小程序截图/请求位置信息.png');background-size:390px auto;background-position:-20px -597px;background-repeat:no-repeat"></div>
      <!-- 「一水瑜伽」+ 加粗「申请」，实测 #1A1A1A -->
      <span style="margin-left:7px;font-size:15px;color:#1A1A1A;line-height:1">一水瑜伽<b style="font-weight:600;margin-left:5px">申请</b></span>
      <!-- 信息图标：源图 x1058..1101 → 逻辑 x352.7，直径约 15pt，实测 #B2B2B2 -->
      <svg width="15" height="15" viewBox="0 0 16 16" style="margin-left:auto;flex:none"><circle cx="8" cy="8" r="7.2" fill="none" stroke="#B2B2B2" stroke-width="1"/><circle cx="8" cy="4.6" r=".95" fill="#B2B2B2"/><path d="M8 7.1v4.8" stroke="#B2B2B2" stroke-width="1.3" stroke-linecap="round"/></svg>
    </div>

    <!-- 授权说明主标题：源图 y1943..1988 → 逻辑 647.7..662.7，实测 #1A1A1A
         标题行底 619.3 → 主标题顶 647.7，故 margin-top = 28.4 - 行内余量 ≈ 25 -->
    <div style="margin-top:29px;font-size:16px;font-weight:600;color:#1A1A1A;line-height:1">获取你的位置信息</div>
    <!-- 授权说明副文案：源图 y2027..2063 → 逻辑 675.7..687.7，实测 #737373
         主标题底 662.7 → 副文案顶 675.7，故 margin-top = 13 - 字高余量 ≈ 8 -->
    <div style="margin-top:11px;font-size:14px;color:#737373;line-height:1">推荐附近场馆服务</div>

    <!-- 按钮行：源图 y2187..2330 → 逻辑 729..776.7
         各 120x48、间距 16、在弹层内居中（左 67 / 右 67）
         副文案底 687.7 → 按钮顶 729，间距由 flex 的 auto 撑开，bottom = 844-776.7 ≈ 67 -->
    <div style="margin-top:auto;margin-bottom:67px;display:flex;justify-content:center;gap:16px;width:100%">
      <div class="wx-btn press cursor-pointer" style="width:120px;background:#F2F2F2;color:#07C160">拒绝</div>
      <div class="wx-btn press cursor-pointer" style="width:120px;background:#07C160;color:#fff">允许</div>
    </div>

  </div>

</div>
</body>
</html>
