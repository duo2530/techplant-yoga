<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骨架示例 · 一水瑜伽普拉提</title>
<!-- ① 三件套固定顺序：tailwind → tokens → app.css -->
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="phone">

  <!-- ============ 固定区 1：状态栏（所有页面都一样，原样复制） ============ -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#000"><path d="M8 10.6 5.9 8.3a3.1 3.1 0 0 1 4.2 0L8 10.6Zm0-5.1c-1.5 0-2.9.5-4 1.5L2.6 5.6A7.9 7.9 0 0 1 8 3.4c2 0 3.9.8 5.4 2.2L12 7c-1.1-1-2.5-1.5-4-1.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#000"/><path d="M23 4.2v3.6c1-.3 1.4-.9 1.4-1.8s-.4-1.5-1.4-1.8Z" fill="#000" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- ============ 固定区 2：导航栏 ============ -->
  <!-- 一级页（首页）：品牌字样式，无返回箭头 -->
  <div class="navbar brand">
    <span class="nav-title">一水·瑜伽普拉提</span>
    <div class="capsule">
      <span class="cap-btn"><svg width="17" height="5" viewBox="0 0 17 5" fill="#333"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="8.5" cy="2.5" r="1.6"/><circle cx="14.5" cy="2.5" r="1.6"/></svg></span>
      <span class="cap-div"></span>
      <span class="cap-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="1.6" fill="#333" stroke="none"/></svg></span>
    </div>
  </div>

  <!-- ============ 二级页导航栏：三种形态，逐页按截图选 ============
       ① 「‹ 返回」：申请体验 / 约教练 / 我的体验课
       ② 「‹」纯箭头：消息 / 活动列表
       ③ 什么都不加：用户协议 / 隐私协议 / 登录页

  <div class="navbar">
    <div class="nav-back">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
      <span>返回</span>   <!-- 形态②就把这一行删掉；形态③连 .nav-back 一起删掉 -->
    </div>
    <span class="nav-title">约课</span>
    <div class="capsule">…同上…</div>
  </div>
  -->

  <!-- ============ 可滚动内容区 ============ -->
  <div class="screen">

    <!-- 雪碧图示例：直接从原截图切一段照片，不裁图、不改动原文件
         源图 1170x2532 @3x，按 390px 宽显示 = 缩放到 1/3
         要显示源图 y=276..768px 这一段 → 高度 (768-276)/3 = 164px
         background-position 的 y = -276/3 = -92px -->
    <div class="w-[390px] h-[164px] bg-no-repeat"
         style="background-image:url('../需求文档/小程序截图/首页1.png');
                background-size:390px auto;
                background-position:0 -92px"></div>

    <!-- 普通内容块：直接用 Tailwind 原子类 -->
    <div class="mx-4 mt-3 bg-white rounded-xl p-4 shadow-sm">
      <div class="text-[15px] font-semibold text-ink-1">区块标题</div>
      <div class="text-[13px] text-ink-3 mt-1">正文文案</div>
    </div>

  </div>

  <!-- ============ 固定区 3：TabBar（仅一级页有） ============ -->
  <div id="tabbar"></div>
</div>

<script src="assets/tabbar.js"></script>
<script>renderTabBar('home')</script>
</body>
</html>
