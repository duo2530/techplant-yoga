<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的体验课 · 一水瑜伽普拉提</title>
<!-- ① 三件套固定顺序：tailwind → tokens → app.css -->
<script src="assets/tailwind.js"></script>
<script src="assets/tokens.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 本页实测色值（像素采样，非估计）
     导航栏/Tab 栏底 #FFFFFF / 内容区底 #F8F8F8
     未选中 Tab 文字 #080808 / 选中 Tab 文字与下划线 #3165CC / 空态文字 #AAAAAA */
  .tab-item { position: absolute; top: 0; height: 54px; display: flex; align-items: center;
              font-size: 15px; line-height: 1; white-space: nowrap; color: #080808; text-decoration: none; }
  .tab-item.on { color: #3165CC; }
  .tab-underline { position: absolute; left: 0; bottom: 0; width: 20px; height: 3px; border-radius: 1.5px; background: #3165CC; }
</style>
</head>
<body>
<div class="phone">

  <!-- ============ 固定区 1：状态栏 ============ -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#000"><path d="M8 10.6 5.9 8.3a3.1 3.1 0 0 1 4.2 0L8 10.6Zm0-5.1c-1.5 0-2.9.5-4 1.5L2.6 5.6A7.9 7.9 0 0 1 8 3.4c2 0 3.9.8 5.4 2.2L12 7c-1.1-1-2.5-1.5-4-1.5Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#000"/><path d="M23 4.2v3.6c1-.3 1.4-.9 1.4-1.8s-.4-1.5-1.4-1.8Z" fill="#000" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- ============ 固定区 2：导航栏（二级页：返回箭头，无 TabBar） ============ -->
  <div class="navbar">
    <a href="home.html" class="nav-back press cursor-pointer" aria-label="返回">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
      <span>返回</span>
    </a>
    <span class="nav-title">我的体验课</span>
    <div class="capsule">
      <span class="cap-btn"><svg width="17" height="5" viewBox="0 0 17 5" fill="#333"><circle cx="2.5" cy="2.5" r="1.6"/><circle cx="8.5" cy="2.5" r="1.6"/><circle cx="14.5" cy="2.5" r="1.6"/></svg></span>
      <span class="cap-div"></span>
      <span class="cap-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="1.6" fill="#333" stroke="none"/></svg></span>
    </div>
  </div>

  <!-- ============ 可滚动内容区 ============ -->
  <div class="screen" style="background:#F8F8F8">

    <!-- 状态筛选 Tab 栏：源图 y=234..396 → 逻辑 78..132（54px 高，底部无分隔线，直接接灰底）
         四个 Tab 文字中心（逻辑 x）：48.3 / 146.5 / 243.7 / 341 —— 实测等距，居中排布 -->
    <div class="relative bg-white" style="height:54px">
      <a href="#全部" class="tab-item on" style="left:35.3px;width:26.7px">全部<span class="tab-underline"></span></a>
      <a href="#申请待审核" class="tab-item" style="left:109px;width:75.3px">申请待审核</a>
      <a href="#审核通过" class="tab-item" style="left:206.3px;width:75.3px">审核通过</a>
      <a href="#审核拒绝" class="tab-item" style="left:303.7px;width:75.3px">审核拒绝</a>
    </div>

    <!-- 主体：空态（截图无任何卡片，原文“暂无数据”）
         整页除「插画 + 暂无数据」外完全空白，不编造体验课卡片。
         实测：插画所在白块为 83x83pt 正方形（源图 x=461..709, y=705..953），
         块顶 y=235pt、块底 y=317.7pt；文案在块下 31.3pt 处（源图 y=995..1036）。 -->
    <div class="relative" style="min-height:658px;background:#F8F8F8">

      <!-- 空态整块：正常文档流排列，插画与文案间距 31.3pt，整块水平居中 -->
      <div class="flex flex-col items-center" style="padding-top:93px">

        <!-- 空态插画：雪碧图法直接从原截图切图，不裁图、不改动原图
             源图 1170x2532 @3x，按 390px 宽显示 = 缩放到 1/3
             容器 83x83pt 对应源图 x=459..708 / y=705..954
             background-position: x = -459/3 = -153px, y = -705/3 = -235px
             显式声明 no-repeat，避免 background-position 出界后平铺把整张截图带进来 -->
        <div style="width:83px;height:83px;
                    background-image:url('../需求文档/用户端/用户端小程序截图/我的体验课.png');
                    background-repeat:no-repeat;
                    background-size:390px auto;
                    background-position:-153px -235px"></div>

        <!-- 空态文案：源图 y=995..1036，位于插画块下 31.3pt -->
        <div class="text-center text-[14px] text-[#AAAAAA] leading-none" style="margin-top:13.3px">暂无数据</div>

      </div>

    </div>
  </div>

</div>
</body>
</html>
