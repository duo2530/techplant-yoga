# 本地开发依赖：MySQL 与 Redis，连接参数与 backend/ruoyi-admin 的 application*.yml 默认值一致。
# 首次启动（数据卷为空）时按顺序导入 backend/sql 下的三个初始化脚本；重新初始化需 docker compose down -v。
name: techplant-yoga

services:
  mysql:
    image: mysql:8.0
    container_name: yoga-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: yoga
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ry.sql:ro
      - ./backend/sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ./backend/sql/yoga.sql:/docker-entrypoint-initdb.d/03-yoga.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    container_name: yoga-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
