name: Tear down Alibaba Cloud SAE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sae-deploy
  cancel-in-progress: false

jobs:
  teardown:
    name: Stop SAE apps and release public access
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: sae
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1

      - name: Obtain Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          role-session-expiration: '3600'

      - name: Delete DNS records, release CLB and stop apps
        run: bash tools/sae/teardown.sh
