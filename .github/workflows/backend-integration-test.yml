name: Backend Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      test_required: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect files that affect backend tests
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**/src/**'
              - 'backend/**/pom.xml'
              - 'backend/sql/**'
              - 'backend/*.sh'
              - 'backend/*.bat'
              - 'docker-compose.yml'
              - '.github/workflows/backend-integration-test.yml'
              - 'tools/java-style/**'
              - 'checkStyle.xml'

  integration-test:
    name: Run backend integration tests
    needs: changes
    if: ${{ needs.changes.outputs.test_required == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Verify Docker
        run: docker info

      # Testcontainers starts isolated MySQL 8 and Redis 7 containers itself.
      - name: Run integration and concurrency tests
        working-directory: backend
        run: |
          mvn -B -ntp -pl ruoyi-yoga -am \
            -Dyoga.concurrency=true \
            -DfailIfNoTests=false \
            test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  ci-gate:
    name: CI Gate
    needs: [changes, integration-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required tests passed or were safely skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_REQUIRED: ${{ needs.changes.outputs.test_required }}
          TEST_RESULT: ${{ needs.integration-test.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::File change detection failed ($CHANGES_RESULT)"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$TEST_REQUIRED" == "true" ]]; then
            if [[ "$TEST_RESULT" != "success" ]]; then
              echo "::error::Backend integration tests did not pass ($TEST_RESULT)"
              exit 1
            fi
            echo "Required backend integration tests passed."
          elif [[ "$TEST_REQUIRED" == "false" && "$TEST_RESULT" == "skipped" ]]; then
            echo "No backend-impacting changes: integration tests safely skipped."
          else
            echo "::error::Unexpected test decision (required=$TEST_REQUIRED, result=$TEST_RESULT)"
            exit 1
          fi
