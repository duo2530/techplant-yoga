name: Deploy to Alibaba Cloud SAE

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/deploy-sae.yml'
      - 'tools/sae/**'
      - '.claude/skills/yoga-cloud-deploy/config/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && 'sae-deploy' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SAE image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [backend, web-pc, web-h5]
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --file tools/sae/Dockerfile --target "$APP" --tag "yoga-release:$APP" .

      - name: Check frontend image
        if: matrix.app != 'backend'
        run: docker run --rm -e GATEWAY_UPSTREAM=127.0.0.1:8080 "yoga-release:$APP" nginx -t

      - name: Save image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        run: docker save "yoga-release:$APP" | gzip -1 > "$APP.tar.gz"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        with:
          name: sae-image-${{ matrix.app }}
          path: ${{ matrix.app }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3

  deploy:
    name: Publish and start SAE apps
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sae
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check SAE environment configuration
        env:
          ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          missing=()
          for name in ALIYUN_OIDC_PROVIDER_ARN ALIYUN_ROLE_ARN ACR_USERNAME ACR_PASSWORD; do
            if [[ -z ${!name} ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Configure the following in Settings > Environments > sae: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: sae-image-*
          path: images
          merge-multiple: true

      - name: Install Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1

      - name: Obtain Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          role-session-expiration: '3600'

      - name: Publish images and deploy
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash tools/sae/deploy.sh images
